{{- if .Values.issuetracker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-issuetracker-server
  labels:
    appId: issuetracker
    serviceId: server
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      appId: issuetracker
      serviceId: server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        appId: issuetracker
        serviceId: server
    spec:
      containers:
        - name: main
          env:
              - name: ISSUETRACKER_PROVIDER
                value: {{ .Values.issuetracker.server.provider | default "none" }}
              {{- if .Values.issuetracker.server.configSecret }}
              - name: ISSUETRACKER_CONFIG_FILE
                value: /etc/issuetracker/config.json 
              {{- else }}
              - name: ISSUETRACKER_CONFIG
                value: {{ .Values.issuetracker.server.config | toJson | quote }}
              {{- end }}
              - name: ISSUETRACKER_SELF_URL
                value: {{ include "ingress.url" . }}
              - name: DEBUG
                value: {{ include "debug" . }}
              - name: mito_endpoints_core_authnz
                value: {{ include "ingress.url" . }}/service/core/authnz
              - name: MOS_AUTHNZ_LOGINPATH
                value: {{ include "ingress.url" . }}/authnz/login
          image: "{{ .Values.global.image.registry }}/{{ .Values.images.issuetracker.serverImage }}:{{ .Values.images.issuetracker.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 10
          ports:
            - name: port-5000
              containerPort: 5000
              protocol: TCP
          resources:
            {{- toYaml .Values.issuetracker.server.resources | nindent 12 }}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          {{- if .Values.issuetracker.server.configSecret }}
          volumeMounts:
            - name: config
              mountPath: /etc/issuetracker
              readOnly: true
          {{- end }}
      dnsPolicy: ClusterFirst
      {{- with .Values.global.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      {{- if .Values.issuetracker.server.configSecret }}
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.issuetracker.server.configSecret.name }}
            items:
              - key: {{ .Values.issuetracker.server.configSecret.key }}
                path: config.json
      {{- end }}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-issuetracker-ui
  labels:
    appId: issuetracker
    serviceId: ui
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      appId: issuetracker
      serviceId: ui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        appId: issuetracker
        serviceId: ui
    spec:
      containers:
        - name: main
          env:
            - name: DEBUG
              value: {{ include "debug" . }}
          image: "{{ .Values.global.image.registry }}/{{ .Values.images.issuetracker.uiImage }}:{{ .Values.images.issuetracker.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
          ports:
            - name: port-8080
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.issuetracker.ui.resources | nindent 12 }}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      {{- with .Values.global.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30

---

apiVersion: v1
kind: Service
metadata:
  name: issuetracker-server
  labels:
    appId: issuetracker
    serviceId: server
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: port-issuetracker-server-main-0
      port: 5000
      protocol: TCP
      targetPort: 5000
  selector:
    appId: issuetracker
    serviceId: server
  sessionAffinity: None
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: issuetracker-ui
  labels:
    appId: issuetracker
    serviceId: ui
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: port-issuetracker-ui-main-0
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    appId: issuetracker
    serviceId: ui
  sessionAffinity: None
  type: ClusterIP

{{- end -}}
