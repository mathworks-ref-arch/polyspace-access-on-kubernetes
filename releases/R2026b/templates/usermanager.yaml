  name: usermanager-authnz
  labels:
    appId: usermanager
    serviceId: authnz
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: port-usermanager-authnz-main-0
      port: 5693
      protocol: TCP
      targetPort: 5693
  selector:
    appId: usermanager
    serviceId: authnz
  sessionAffinity: None
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: usermanager-server
  labels:
    appId: usermanager
    serviceId: server
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: port-usermanager-server-main-0
      port: 5000
      protocol: TCP
      targetPort: 5000
  selector:
    appId: usermanager
    serviceId: server
  sessionAffinity: None
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: usermanager-ui
  labels:
    appId: usermanager
    serviceId: ui
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: port-usermanager-ui-main-0
      port: 8080
